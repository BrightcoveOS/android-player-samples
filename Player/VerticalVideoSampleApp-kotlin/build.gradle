plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    compileSdk ANDROID_COMPILE_SDK_VERSION
    namespace "com.brightcove.player.samples.verticalvideo.kotlin"

    defaultConfig {
        applicationId "com.brightcove.player.samples.verticalvideo.kotlin"
        minSdk ANDROID_MIN_SDK_VERSION
        targetSdk ANDROID_TARGET_SDK_VERSION
        versionCode 1
        versionName "1.0"
        multiDexEnabled true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11.toString()
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation "com.brightcove.player:android-appcompat-plugin:${anpVersion}"
    implementation "androidx.appcompat:appcompat:${ANDROIDX_APPCOMPAT}"
    implementation "androidx.constraintlayout:constraintlayout:${ANDROIDX_CONSTRAINT_LAYOUT}"
    implementation "androidx.recyclerview:recyclerview:${ANDROIDX_RECYCLER_VIEW}"
    implementation "androidx.viewpager2:viewpager2:1.1.0"
    implementation "com.google.android.material:material:${ANDROID_MATERIAL}"
    implementation "io.coil-kt.coil3:coil:${COIL_VERSION}"
    implementation "io.coil-kt.coil3:coil-network-okhttp:${COIL_VERSION}"
}
